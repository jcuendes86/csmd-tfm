steps:
  # 1) Copiar ficheros
  - name: 'gcr.io/cloud-builders/npm'
    id: Copiar ficheros
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Copying files..."
        mv /workspace/backend/cars-prediction-api/* /cars-prediction-api
        echo "Listing files 1:"
        ls -la /cars-prediction-api
        echo "Listing files 2:"
        ls -la /workspace
        echo "Listing files 3:"
        ls -la /workspace/backend
        echo "Listing files 4:"
        ls -la /workspace/backend/cars-prediction-api
    volumes:
      - name: 'cars-prediction-api'
        path: '/cars-prediction-api'
  # 2) Instalar dependencias
  - name: gcr.io/cloud-builders/npm
    id: Installing dependencies
    dir: /cars-prediction-api
    args:
      - '-c'
      - |
        echo "Installing dependencies..."
        echo "Current dir:"
        pwd
        echo "Listing files:"
        ls -la
        echo "Listing files - workspace dir:"
        ls -la ../workspace
        npm run build
    entrypoint: bash
    volumes:
      - name: 'cars-prediction-api'
        path: '/cars-prediction-api'
  # 3) Build de la imagen Docker
  - name: gcr.io/cloud-builders/docker
    id: Build Docker Image
    dir: /cars-prediction-api
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO_NAME}/${_IMAGE_NAME}:${_IMAGE_TAG}"
      - "-f"
      - "./Dockerfile"
      - "."
    volumes:
      - name: 'cars-prediction-api'
        path: '/cars-prediction-api'
  # 4) Push de la imagen a Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: Push Docker Image
    dir: /cars-prediction-api
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO_NAME}/${_IMAGE_NAME}:${_IMAGE_TAG}"
    volumes:
      - name: 'cars-prediction-api'
        path: '/cars-prediction-api'
  # 5) Despliegue en Cloud Run
  - name: gcr.io/cloud-builders/gcloud
    id: Deploy
    dir: /cars-prediction-api
    args:
      - run
      - deploy
      - "${_SERVICE_NAME}"
      - "--region=${_REGION}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO_NAME}/${_IMAGE_NAME}:${_IMAGE_TAG}"
    volumes:
      - name: 'cars-prediction-api'
        path: '/cars-prediction-api'
  # 6) Actualizar trafico a la nueva revision
  - name: gcr.io/cloud-builders/gcloud
    id: Update Traffic
    dir: /cars-prediction-api
    args:
      - run
      - services
      - update-traffic
      - "${_SERVICE_NAME}"
      - "--region=${_REGION}"
      - "--to-revisions=LATEST=100"
    volumes:
      - name: 'cars-prediction-api'
        path: '/cars-prediction-api'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  # Región de Artifact Registry (p.ej. europe-southwest1, europe-west1, etc.)
  _REGION: 'europe-west1'
  # Nombre del servicio en Cloud Run
  _SERVICE_NAME: 'cars-prediction-api'
  # Nombre de la imagen (sin repo ni tag)
  _IMAGE_NAME: "cars-prediction-api"
  # Tag de la imagen
  _IMAGE_TAG: "latest"
  # Nombre del repositorio de Artifact Registry (no la URL)
  _ARTIFACT_REPO_NAME: 'default-repo-name'
